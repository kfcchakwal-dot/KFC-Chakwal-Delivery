name: Build and typecheck

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Dependency security audit
        run: |
          npm audit --json > npm-audit.json || true
          node -e "const a=require('./npm-audit.json'); if (a.error) { console.warn('Audit warning:', a.error.summary || a.error.code); } else { console.log('Audit vulnerabilities:', a.metadata?.vulnerabilities || {}); if (((a.metadata?.vulnerabilities?.high||0) + (a.metadata?.vulnerabilities?.critical||0)) > 0) { console.error('High/critical vulnerabilities found'); process.exit(1); } }"
      - run: npm run lint
      - run: node --check functions/index.js
      - run: npm run build
